<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Kanban Board</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">My Kanban Board</h1>
    <div class="user-info" id="user-info" hidden>
      <span class="user-email" id="user-email"></span>
      <button class="btn-logout" id="btn-logout" aria-label="로그아웃">로그아웃</button>
    </div>
  </header>

  <!-- 인증 오버레이 (비로그인 시 표시) -->
  <div id="auth-overlay" class="auth-overlay" role="dialog" aria-modal="true" aria-label="로그인">
    <div class="auth-card">
      <h2 class="auth-title" id="auth-title">로그인</h2>

      <p class="auth-error" id="auth-error" role="alert" hidden></p>

      <form class="auth-form" id="auth-form" novalidate>
        <label class="auth-label" for="input-email">이메일</label>
        <input class="auth-input" id="input-email" type="email"
               placeholder="you@example.com" autocomplete="email" required>

        <label class="auth-label" for="input-password">비밀번호</label>
        <input class="auth-input" id="input-password" type="password"
               placeholder="비밀번호 입력" autocomplete="current-password" required>

        <button class="btn-auth-submit" id="btn-auth-submit" type="submit">로그인</button>
      </form>

      <p class="auth-toggle-text">
        계정이 없으신가요?
        <button class="btn-auth-toggle" id="btn-auth-toggle" type="button">회원가입</button>
      </p>

      <div class="auth-divider"><span>또는</span></div>

      <div class="auth-oauth">
        <button class="btn-oauth btn-google" id="btn-google" type="button" aria-label="Google로 로그인">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z" fill="#4285F4"/>
            <path d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.01c-.72.48-1.63.76-2.7.76-2.08 0-3.84-1.4-4.47-3.29H1.88v2.07A8 8 0 0 0 8.98 17z" fill="#34A853"/>
            <path d="M4.51 10.52A4.8 4.8 0 0 1 4.26 9c0-.53.09-1.04.25-1.52V5.41H1.88A8 8 0 0 0 .98 9c0 1.29.31 2.51.9 3.59l2.63-2.07z" fill="#FBBC05"/>
            <path d="M8.98 3.58c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 8.98 1a8 8 0 0 0-7.1 4.41l2.63 2.07c.63-1.89 2.39-3.27 4.47-3.27z" fill="#EA4335"/>
          </svg>
          Google로 로그인
        </button>

        <button class="btn-oauth btn-github" id="btn-github" type="button" aria-label="GitHub로 로그인">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.38 7.86 10.9.58.1.79-.25.79-.55v-1.93C5.73 21 5.01 18.97 5.01 18.97c-.52-1.33-1.28-1.68-1.28-1.68-1.04-.72.08-.7.08-.7 1.16.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.19a11.1 11.1 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.2-1.5 3.17-1.19 3.17-1.19.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.43-2.7 5.41-5.27 5.69.41.36.78 1.06.78 2.13v3.16c0 .31.21.66.8.55A10.51 10.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
          </svg>
          GitHub로 로그인
        </button>
      </div>
    </div>
  </div>

  <main class="board" id="board" hidden>

    <!-- To-do 컬럼 -->
    <section class="column" id="todo">
      <div class="column-header">
        <span class="column-indicator"></span>
        <span class="column-title">To-do</span>
        <span class="column-count">0</span>
      </div>
      <div class="card-list" role="list"></div>
      <div class="add-card">
        <input type="text" class="card-input" placeholder="새 카드 입력...">
        <button class="btn-add" aria-label="카드 추가">추가</button>
      </div>
    </section>

    <!-- In-Progress 컬럼 -->
    <section class="column" id="in-progress">
      <div class="column-header">
        <span class="column-indicator"></span>
        <span class="column-title">In-Progress</span>
        <span class="column-count">0</span>
      </div>
      <div class="card-list" role="list"></div>
      <div class="add-card">
        <input type="text" class="card-input" placeholder="새 카드 입력...">
        <button class="btn-add" aria-label="카드 추가">추가</button>
      </div>
    </section>

    <!-- Done 컬럼 -->
    <section class="column" id="done">
      <div class="column-header">
        <span class="column-indicator"></span>
        <span class="column-title">Done</span>
        <span class="column-count">0</span>
      </div>
      <div class="card-list" role="list"></div>
      <div class="add-card">
        <input type="text" class="card-input" placeholder="새 카드 입력...">
        <button class="btn-add" aria-label="카드 추가">추가</button>
      </div>
    </section>

  </main>

  <script src="app.js" defer></script>
</body>
</html>
