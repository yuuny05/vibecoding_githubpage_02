<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Gowun+Batang&family=Petit+Formal+Script&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

  <!-- ── Auth Overlay ── -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-brand-script">my</div>
      <div class="auth-brand-title">Todo<span class="dot">.</span></div>
      <div class="auth-brand-caption">daily rituals</div>

      <div class="auth-tabs">
        <button class="auth-tab is-active" data-tab="signin">로그인</button>
        <button class="auth-tab" data-tab="signup">회원가입</button>
      </div>

      <div class="auth-form">
        <input type="email"    id="auth-email"    class="auth-input" placeholder="이메일" />
        <input type="password" id="auth-password" class="auth-input" placeholder="비밀번호 (6자 이상)" />
        <p id="auth-error"   class="auth-error"></p>
        <p id="auth-message" class="auth-message"></p>
        <button id="auth-submit" class="auth-submit">로그인</button>

        <div class="auth-divider"><span>또는</span></div>

        <div class="auth-social">
          <button id="google-login" class="auth-social-btn auth-social-btn--google">
            <svg width="16" height="16" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
              <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
              <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
              <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            Google로 계속하기
          </button>

          <button id="github-login" class="auth-social-btn auth-social-btn--github">
            <svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
              <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
            </svg>
            GitHub로 계속하기
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="boudoir">

    <!-- ── Sidebar ── -->
    <aside class="boudoir__sidebar">
      <span class="boudoir__corner-motif">✦</span>
      <div class="boudoir__brand">
        <div class="boudoir__brand-script">my</div>
        <div class="boudoir__brand-title">Todo<span class="dot">.</span></div>
        <div class="boudoir__brand-caption">daily rituals</div>
      </div>
      <div class="boudoir__ornament">✦</div>
      <nav class="boudoir__nav">
        <div class="boudoir__nav-label">Collections</div>
        <div class="boudoir__nav-list">
          <button class="boudoir__nav-item is-active" data-priority="all">
            <span class="boudoir__nav-en">All</span>
            <span class="boudoir__nav-kr">전체</span>
            <span class="boudoir__nav-count" id="count-all">0</span>
          </button>
          <button class="boudoir__nav-item" data-priority="high">
            <span class="boudoir__nav-en">High</span>
            <span class="boudoir__nav-kr">높음</span>
            <span class="boudoir__nav-count" id="count-high">0</span>
          </button>
          <button class="boudoir__nav-item" data-priority="medium">
            <span class="boudoir__nav-en">Medium</span>
            <span class="boudoir__nav-kr">중간</span>
            <span class="boudoir__nav-count" id="count-medium">0</span>
          </button>
          <button class="boudoir__nav-item" data-priority="low">
            <span class="boudoir__nav-en">Low</span>
            <span class="boudoir__nav-kr">낮음</span>
            <span class="boudoir__nav-count" id="count-low">0</span>
          </button>
        </div>
      </nav>
      <div class="boudoir__quote">
        <div class="boudoir__quote-motif">❝</div>
        <div class="boudoir__quote-text">작은 일들이 모여<br>큰 하루가 됩니다.</div>
        <div class="boudoir__quote-caption">daily reminder</div>
      </div>

      <div class="boudoir__user">
        <span class="boudoir__user-email" id="user-email"></span>
        <button class="boudoir__logout" id="logout-btn">로그아웃</button>
      </div>
    </aside>

    <!-- ── Main ── -->
    <main class="boudoir__main">
      <header class="boudoir__header">
        <div>
          <div class="boudoir__date" id="today-date"></div>
          <div class="boudoir__title-row">
            <h1 class="boudoir__title">Todo</h1>
            <span class="boudoir__title-kr">할일</span>
          </div>
        </div>
        <div class="boudoir__progress">
          <div class="boudoir__progress-label">완료</div>
          <div class="boudoir__progress-count">
            <span class="boudoir__progress-num" id="done-count">0</span>
            <span class="boudoir__progress-den">/ <span id="total-count">0</span></span>
          </div>
          <div class="boudoir__progress-bar"><i id="progress-fill" style="width:0%"></i></div>
        </div>
      </header>

      <div class="boudoir__filters">
        <button class="boudoir__pill is-active" data-filter="all">All</button>
        <button class="boudoir__pill" data-filter="active">Active</button>
        <button class="boudoir__pill" data-filter="done">Done</button>
        <span class="boudoir__filters-hint" id="remaining"></span>
      </div>

      <div class="boudoir__list">
        <ul id="todo-list"></ul>
      </div>

      <div class="boudoir__add">
        <select id="priority-select">
          <option value="high">높음</option>
          <option value="medium" selected>중간</option>
          <option value="low">낮음</option>
        </select>
        <input type="text" id="todo-input" class="boudoir__add-input" placeholder="새로운 할일을 입력하세요..." />
        <span class="boudoir__add-hint">Enter ↵</span>
        <button id="add-btn" class="boudoir__add-btn">추가</button>
      </div>
    </main>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
