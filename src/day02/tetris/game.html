<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris — Play</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-body">

  <!-- 인증 화면 -->
  <div id="auth-screen">
    <h1>TETRIS</h1>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">로그인</button>
      <button class="auth-tab" data-tab="register">회원가입</button>
    </div>

    <!-- 로그인 폼 -->
    <div id="login-form" class="auth-form">
      <input id="login-email" type="email" placeholder="이메일" autocomplete="email">
      <input id="login-password" type="password" placeholder="비밀번호" autocomplete="current-password">
      <div id="login-error" class="auth-error"></div>
      <button id="login-btn" class="auth-submit-btn">로그인</button>
    </div>

    <!-- 회원가입 폼 -->
    <div id="register-form" class="auth-form hidden">
      <input id="reg-email" type="email" placeholder="이메일" autocomplete="email">
      <input id="reg-nickname" type="text" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="off">
      <input id="reg-password" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="new-password">
      <div id="register-error" class="auth-error"></div>
      <button id="register-btn" class="auth-submit-btn">회원가입</button>
    </div>

    <a href="index.html" class="back-link">← 랜딩 페이지로</a>
  </div>

  <!-- 게임 준비 화면 (로그인 후) -->
  <div id="start-screen" class="hidden">
    <h1>TETRIS</h1>
    <p id="welcome-msg" class="start-welcome"></p>
    <div id="global-best-banner" class="global-best-banner"></div>
    <div id="best-preview" class="best-preview"></div>
    <button id="start-btn">START</button>
    <div class="key-hint">
      <span>←</span> <span>→</span> 이동 &nbsp;
      <span>↓</span> 빠르게 &nbsp;
      <span>↑</span> / <span>Z</span> 회전 &nbsp;
      <span>Space</span> 즉시 낙하 &nbsp;
      <span>P</span> 정지 &nbsp;
      <span>M</span> 음소거
    </div>
    <button id="logout-btn" class="logout-btn">로그아웃</button>
    <a href="index.html" class="back-link">← 랜딩 페이지로</a>
  </div>

  <!-- 게임 화면 -->
  <div id="game-screen">
    <canvas id="board" width="300" height="600"></canvas>

    <div id="panel">
      <div class="panel-box">
        <div class="panel-label">Player</div>
        <div class="panel-value" id="player-name">—</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">Score</div>
        <div class="panel-value" id="score-value">0</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">Level</div>
        <div class="panel-value" id="level-value">1</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">My Best</div>
        <div class="panel-value" id="best-value">—</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">Global Best</div>
        <div class="panel-value" id="global-best-value">—</div>
        <div class="panel-label-sm" id="global-best-player"></div>
      </div>
      <div class="panel-box">
        <div class="panel-label-sm">NEXT</div>
        <canvas id="next-canvas" width="120" height="120"></canvas>
      </div>
      <button class="panel-btn" id="pause-btn">일시정지 (P)</button>
      <button class="panel-btn" id="mute-btn">🔊 음소거 (M)</button>
    </div>
  </div>

  <!-- 오버레이 -->
  <div id="overlay">
    <div class="overlay-box">
      <h2 id="overlay-title">GAME OVER</h2>
      <div class="final-score" id="overlay-score"></div>
      <p id="overlay-sub"></p>
      <div class="overlay-best" id="overlay-best"></div>
      <div class="overlay-global" id="overlay-global"></div>
      <button class="overlay-btn" id="overlay-btn">다시 시작</button>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
