version: "3.9"

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tetris
      MYSQL_USER: tetris
      MYSQL_PASSWORD: tetrispass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "tetris", "-ptetrispass"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "mysql+pymysql://tetris:tetrispass@db:3306/tetris?charset=utf8mb4"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  mysql_data:
